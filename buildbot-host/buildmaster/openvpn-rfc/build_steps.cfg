# -*- python -*-
# ex: set filetype=python:
#
# Mirrors .github/workflows/build.yaml of the openvpn-rfc repository


def openvpnRfcAddBuildStepsToBuildFactory(factory):
    pipenv = "pipenv"
    pipenv_env = {
        "PIPENV_IGNORE_VIRTUALENVS": "1",
        "PIPENV_VENV_IN_PROJECT": "1",
        "PIPENV_NOSPIN": "1",
        "PIPENV_YES": "1",
    }

    factory.addStep(
        steps.Git(
            repourl=util.Interpolate("%(prop:repository)s"),
            git_credentials=gerrit_git_credentials,
            mode="full",
            method="fresh",
            name="clone",
            description="cloning",
            descriptionDone="clone",
        )
    )

    factory.addStep(
        steps.ShellCommand(
            command=[pipenv, "install", "-d"],
            name="create pipenv",
            description="installing",
            descriptionDone="create pipenv",
            env=pipenv_env,
            haltOnFailure=True,
        )
    )

    for fmt in ["html", "txt"]:
        factory.addStep(
            steps.ShellCommand(
                command=[pipenv, "run", "make", f"openvpn-wire-protocol.{fmt}"],
                name=f"build {fmt}",
                description="building",
                descriptionDone=f"build {fmt}",
                env=pipenv_env,
            )
        )

    return factory
