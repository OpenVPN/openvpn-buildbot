def openvpnAddBranchPropsStepToBuildFactory(factory, shell_env):
    """Set per-branch properties from ./.buildbot/buildbot_props.sh

    The script outputs KEY=VALUE lines which are set as build properties.
    Also points PKG_CONFIG_PATH in shell_env to branch_pkg_config_path.
    """

    def extract_props(rc, stdout, stderr):
        props = {}
        for line in stdout.split("\n"):
            if "=" in line:
                (key, value) = line.strip().split("=", 1)
                props[key] = value
        return props

    factory.addStep(
        steps.SetPropertyFromCommand(
            command="./.buildbot/buildbot_props.sh", extract_fn=extract_props
        )
    )
    shell_env["PKG_CONFIG_PATH"] = util.Property("branch_pkg_config_path")


def openvpnBranchConfigOpts(prop):
    """Renderable list of configure options from a space-separated property"""
    return util.Transform(str.split, util.Property(prop, default=""), " ")
