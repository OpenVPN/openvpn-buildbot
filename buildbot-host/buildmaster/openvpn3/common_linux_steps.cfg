# -*- python -*-
# ex: set filetype=python:
def openvpn3AddCommonLinuxStepsToBuildFactory(factory):
    factory.addStep(
        steps.Git(
            repourl=openvpn3_repo_url,
            git_credentials=github_git_credentials,
            mode="incremental",
            name="clone",
            description="cloning",
            descriptionDone="cloning",
        )
    )

    factory.addStep(
        steps.ShellCommand(
            command=["rm", "-fr", "build"],
            name="delete old build directory",
            description="preparing",
            descriptionDone="preparing",
        )
    )
    factory.addStep(
        steps.ShellCommand(
            command=["mkdir", "-p", "build"],
            name="create build directory",
            description="preparing",
            descriptionDone="preparing",
        )
    )

    factory.addStep(
        steps.ShellCommand(
            command=["cmake", ".."],
            name="configure",
            workdir="build/build",
            description="configuring",
            descriptionDone="configuring",
            haltOnFailure=True,
        )
    )

    factory.addStep(
        steps.ShellCommand(
            command=["cmake", "--build", "."],
            name="building",
            workdir="build/build",
            description="building",
            descriptionDone="building",
        )
    )

    return factory
